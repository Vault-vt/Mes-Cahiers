<style>
/* Layout: a shelf of notebook covers, then one notebook at a time with a big floating tool bar at the bottom. Highlighter yellow is the accent. */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --surface2:#ECEEF6; --ink:#161B33; --muted:#6A7090; --line:#E1E4EF;
  --primary:#161B33; --primary-ink:#FFFFFF; --mark:#FFD84D; --mark-ink:#161B33; --warn:#E5484D;
  --paper:#FFFFFF; --paper-ink:#161B33; --paper-rule:#E3E8F4;
  --shadow-s:0 1px 2px rgba(22,27,51,.08),0 2px 10px rgba(22,27,51,.06);
  --shadow-l:0 10px 34px rgba(22,27,51,.18),0 2px 6px rgba(22,27,51,.08);
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --brand:'Aref Ruqaa','Cairo',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1120; --surface:#181C33; --surface2:#232844; --ink:#EEF0FA; --muted:#9AA0C2; --line:#2A3050;
    --primary:#EEF0FA; --primary-ink:#161B33; --warn:#FF6B70;
    --shadow-s:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
    --shadow-l:0 10px 34px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#181C33; --surface2:#232844; --ink:#EEF0FA; --muted:#9AA0C2; --line:#2A3050;
  --primary:#EEF0FA; --primary-ink:#161B33; --warn:#FF6B70;
  --shadow-s:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
  --shadow-l:0 10px 34px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4); color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;overflow:hidden;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}

.app{position:relative;height:100%;overflow:hidden;background:var(--bg);container-type:inline-size}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;min-height:62px}
.sp{flex:1}
.ib{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--surface2)}
.ib.fill{background:var(--surface);box-shadow:var(--shadow-s)}
.pill{height:42px;min-width:52px;padding:0 14px;border-radius:21px;background:var(--surface);box-shadow:var(--shadow-s);font-weight:700}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}

/* home */
.brand{display:flex;flex-direction:column;line-height:1;padding-inline:6px}
.brand b{font-family:var(--brand);font-size:30px}
.brand small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.hwrap{max-width:940px;margin:0 auto}
.hwrap h1{font-size:30px;font-weight:800;margin:12px 4px 4px;line-height:1.2}
.hwrap p{margin:0 4px 16px;color:var(--muted)}
.fake{display:flex;align-items:center;gap:10px;width:100%;height:54px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-s);padding:0 16px;color:var(--muted);text-align:start;margin-bottom:22px}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@container (min-width:600px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (min-width:900px){.shelf{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cover{position:relative;aspect-ratio:3/4;padding:16px 14px 14px 20px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-align:start;overflow:hidden;box-shadow:var(--shadow-l);background:var(--c);
  border-start-start-radius:8px;border-end-start-radius:8px;border-start-end-radius:22px;border-end-end-radius:22px;transition:transform .15s}
@supports (color:color-mix(in srgb,red,blue)){.cover{background:linear-gradient(150deg,color-mix(in srgb,var(--c),#fff 24%),color-mix(in srgb,var(--c),#000 22%))}}
.cover:active{transform:scale(.97)}
.cover::before{content:'';position:absolute;inset-block:0;inset-inline-start:0;width:16px;background:rgba(0,0,0,.2)}
.cover .label{background:rgba(255,255,255,.96);color:#161B33;border-radius:12px;padding:12px 10px;font-weight:800;font-size:18px;line-height:1.25;text-align:center;margin-top:22%;margin-inline-start:6px;overflow-wrap:anywhere}
.cover .cm{font-size:12.5px;font-weight:600;opacity:.92;margin-inline-start:6px}
.cover .rl{height:34px;margin-inline-start:6px;opacity:.35;background:repeating-linear-gradient(transparent 0 10px,#fff 10px 11px)}
.cover.new{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);align-items:center;justify-content:center;gap:10px;font-weight:700}
.cover.new::before{display:none}
.cover.new svg.i{width:34px;height:34px}

/* notebook */
.ttl{flex:1;min-width:0;font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:8px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-width:46px;height:42px;padding:0 14px;border-radius:15px;background:var(--surface);box-shadow:var(--shadow-s);font-weight:800;flex:none;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.chip.on{background:var(--primary);color:var(--primary-ink)}
.chip.add{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)}
.swrap{max-width:760px;margin:0 auto}
.pgbox{position:relative;width:100%}
.pgbox .paper{position:absolute;left:0;top:0;width:440px;height:622px;transform-origin:0 0}
.ptitle{display:block;width:100%;border:0;background:transparent;outline:0;font-size:24px;font-weight:800;padding:8px 6px 12px;color:var(--ink)}
.ptitle::placeholder{color:var(--muted);opacity:.7}
.paper{--lh:36px;position:relative;background-color:var(--paper);color:var(--paper-ink);border-radius:18px;box-shadow:var(--shadow-s);overflow:hidden}
.paper.bg-lined{background-image:repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),var(--paper-rule) calc(var(--lh) - 1px) var(--lh));background-position:0 calc(23px + var(--fs,17px)*1.58 - var(--lh))}
.paper.bg-grid{background-image:linear-gradient(var(--paper-rule) 1px,transparent 1px),linear-gradient(90deg,var(--paper-rule) 1px,transparent 1px);background-size:24px 24px}
#ed{position:relative;z-index:1;height:100%;overflow:hidden;padding:22px 20px 22px;font-size:var(--fs,19px);line-height:var(--lh);outline:0;caret-color:var(--paper-ink);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
#ed p,#ed div,#ed li,.tbody p,.tbody div,.tbody li{margin:0;text-align:start}
#ed h2,.tbody h2{margin:0;font-size:calc(var(--fs,19px)*1.32);line-height:var(--lh);font-weight:800;text-align:start}
#ed ul,.tbody ul{margin:0;padding-inline-start:28px}
#ed.empty::before{content:attr(data-ph);position:absolute;inset-inline:20px;top:22px;color:#98A0BC;pointer-events:none}
#ed .flash,#ed.flash{animation:flash 2.2s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 6px rgba(255,216,77,.9);background:rgba(255,216,77,.5)}100%{box-shadow:0 0 0 6px rgba(255,216,77,0);background:transparent}}
#cv{position:absolute;inset:0;width:100%;height:100%;z-index:2;mix-blend-mode:multiply;pointer-events:none;touch-action:none}

/* account */
#accBtn{position:relative;margin-inline-end:8px;height:42px;width:42px;border-radius:21px}
#accBtn.on::after{content:'';position:absolute;top:4px;inset-inline-end:4px;width:11px;height:11px;border-radius:50%;background:#1FA971;border:2px solid var(--surface)}
.acme{display:flex;align-items:center;gap:14px;padding:6px 2px 4px}
.acav{width:52px;height:52px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.acme b{display:block;font-size:16px;word-break:break-all}
.acst{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted);margin-top:3px}
.acst i{width:9px;height:9px;border-radius:50%;background:#98A0BC}
.acst.ok i{background:#1FA971}.acst.busy i{background:#F08A24}
.acmsg{min-height:20px;margin-top:10px;font-size:14px;font-weight:700;color:var(--warn);line-height:1.4}
.acmsg.ok{color:var(--muted)}
.lnk{display:block;margin:14px auto 0;padding:8px 12px;font-weight:700;color:var(--muted);text-decoration:underline}
.wide:disabled{opacity:.5}
/* dock */
.dh{align-self:center;width:64px;height:22px;margin:-2px 0 -2px;border-radius:11px;display:grid;place-items:center;color:var(--muted)}
.dh svg{width:22px;height:22px;stroke-width:2.6}
.dock.min{inset-inline-start:auto;inset-inline-end:14px;margin:0;width:auto;padding:0;background:none;border:0;box-shadow:none;border-radius:0}
.dfab{width:60px;height:60px;border-radius:50%;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;box-shadow:var(--shadow-l)}
.dfab svg{width:28px;height:28px}
.dock{position:absolute;z-index:5;inset-inline:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:580px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow-l);padding:8px;display:flex;flex-direction:column;gap:6px}
.opts{display:flex;flex-direction:column;gap:6px;padding:6px 4px 2px}
.hint{font-size:13px;font-weight:600;color:var(--muted);padding:0 6px;line-height:1.3}
.orow{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 6px}
.orow::-webkit-scrollbar{display:none}
.ob{flex:none;min-width:52px;height:58px;padding:0 6px;border-radius:17px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700}
.ob.on{background:var(--primary);color:var(--primary-ink)}
.ob.warn{background:var(--warn);color:#fff}
.dot{flex:none;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.dot.on{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--primary)}
.szb{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface2)}
.szb i{display:block;border-radius:50%;background:var(--ink)}
.szb.on{box-shadow:inset 0 0 0 3px var(--primary)}
.vs{flex:none;width:1px;height:34px;background:var(--line);margin-inline:2px}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.tab{height:62px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tab.on{background:var(--mark);color:var(--mark-ink)}

.chips.dense .chip{min-width:36px;height:36px;padding:0 9px;font-size:13px;border-radius:12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:14px;padding:3px;flex:none}
.step button{width:42px;height:36px;border-radius:11px;font-weight:800}
.step button:active{background:var(--surface)}
.step span{min-width:28px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.cdot{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.16)}
.cpick{display:block;width:100%;height:54px;border:0;border-radius:16px;background:var(--surface2);padding:6px}
.srow{display:flex;align-items:center;gap:12px;margin:6px 2px 14px;color:var(--muted);font-weight:800}
.srow input{flex:1;accent-color:var(--primary)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,var(--tw));gap:14px;justify-content:center;padding-bottom:10px}
.th{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.thp{position:relative;width:var(--tw);height:calc(var(--tw)*1.4142);overflow:hidden;border-radius:8px;box-shadow:var(--shadow-s),0 0 0 1px var(--line);background:var(--paper)}
.th.cur .thp{box-shadow:0 0 0 3px var(--mark),var(--shadow-s)}
.thin{position:absolute;left:0;top:0;width:440px;height:622px;transform-origin:0 0;transform:scale(var(--sc));overflow:hidden;direction:ltr;border-radius:0;box-shadow:none;color:var(--paper-ink)}
.tbody{display:block;padding:22px 20px;font-size:var(--fs);line-height:var(--lh);position:relative;overflow-wrap:anywhere}
.tdraw{position:absolute;left:0;top:0;width:440px;height:622px;mix-blend-mode:multiply}
.tn{font-size:12px;font-weight:800;color:var(--muted)}
.th.cur .tn{color:var(--ink)}
.th.addp .thp{display:grid;place-items:center;background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:14px 2px 0;line-height:1.5}
.bar2{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;margin:20px 0 10px}
.bar2 i{display:block;height:100%;width:3%;background:var(--mark);transition:width .25s}
.ptxt{font-size:14px;font-weight:700;color:var(--muted)}
.ta{display:block;width:100%;min-height:210px;border:0;border-radius:16px;background:var(--surface2);padding:14px;font:inherit;font-size:16px;line-height:1.7;outline:0;resize:vertical;color:var(--ink)}
.ta:focus{box-shadow:0 0 0 3px var(--mark)}
label.wide{cursor:pointer}
/* sheets */
.sheet{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,28,.5)}
.panel{width:100%;max-width:640px;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-l);animation:up .22s ease}
.panel.tall{height:82%}
@keyframes up{from{transform:translateY(34px);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ph b{font-size:20px;font-weight:800}
.fl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:16px 2px 8px}
.inp{width:100%;height:54px;border-radius:16px;border:0;background:var(--surface2);padding:0 16px;outline:0;font-size:17px}
.inp:focus{box-shadow:0 0 0 3px var(--mark)}
.swrow{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.sw.on{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--primary)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);padding:5px;border-radius:16px}
.seg button{height:44px;border-radius:12px;font-weight:700;font-size:15px}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.wide{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:16px;background:var(--surface2);font-weight:700;margin-top:12px}
.wide.pri{background:var(--primary);color:var(--primary-ink);margin-top:22px}
.wide.warn{background:var(--warn);color:#fff}
.hit{display:block;width:100%;text-align:start;padding:12px;border-radius:14px}
.hit:hover,.hit:active{background:var(--surface2)}
.hit .w{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.hit .d{width:12px;height:12px;border-radius:4px;flex:none}
.hit .s{font-size:14px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.hit mark{background:var(--mark);color:#161B33;border-radius:4px;padding:0 2px}
.none{padding:24px;color:var(--muted);text-align:center}
.toast{position:absolute;z-index:60;top:14px;inset-inline:16px;margin-inline:auto;max-width:440px;background:var(--primary);color:var(--primary-ink);padding:13px 16px;border-radius:16px;box-shadow:var(--shadow-l);text-align:center;font-weight:700}

/* app feel: nothing selectable or draggable except the writing area and inputs */
html,body{overscroll-behavior:none;touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#ed,input,textarea,.ta,.inp{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg,canvas{-webkit-user-drag:none;user-drag:none}
.scroll,.panel,.chips,.pgscroll{overscroll-behavior:contain}
/* find bar */
.fbar{display:flex;align-items:center;gap:4px;margin:0 12px 6px;padding:5px 8px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-s);flex:none}
.fbar>svg{color:var(--muted);margin-inline:4px}
.fbar input{flex:1;min-width:0;height:40px;border:0;background:transparent;padding:0 6px;outline:0;font-size:16px}
.fbar .fc{font-weight:800;font-size:13px;color:var(--muted);min-width:52px;text-align:center;font-variant-numeric:tabular-nums;direction:ltr}
.fbar .ib{width:38px;height:38px;border-radius:12px}
::highlight(find){background-color:#FFD84D;color:#161B33}
::highlight(findcur){background-color:#FF8A3D;color:#161B33}
.chip.fhit{box-shadow:inset 0 -4px 0 var(--mark),var(--shadow-s)}
/* cover menu */
div.cover{cursor:pointer;-webkit-tap-highlight-color:transparent}
.cmore{position:absolute;top:8px;inset-inline-end:8px;width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;z-index:2}
.cmore svg{width:22px;height:22px;fill:currentColor;stroke:none}
/* pages sheet */
.panel.pgs{display:flex;flex-direction:column;overflow:hidden}
.pgh{flex:none}
.pgscroll{flex:1;min-height:0;overflow-y:auto;align-content:start;padding-top:12px}
.th{content-visibility:auto;contain-intrinsic-size:auto calc(var(--tw)*1.4142 + 26px)}
.pgh .wide{margin:0 0 10px}
.sortrow{display:flex;align-items:center;margin:-8px 0 14px;min-height:42px}
.cover.sorting{cursor:default}
.mvbar{position:absolute;top:8px;inset-inline:26px 8px;display:flex;align-items:center;justify-content:space-between;gap:6px;z-index:2;background:rgba(255,255,255,.95);color:#161B33;border-radius:14px;padding:3px}
.mvbar button{width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.mvbar button:disabled{opacity:.25}.mvbar button:active{background:var(--surface2)}
.mvbar b{font-size:16px;font-variant-numeric:tabular-nums}
.mvp{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center;gap:6px;z-index:2}
.mvp button{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.95);color:#161B33;display:grid;place-items:center;box-shadow:var(--shadow-s)}
.mvp button:disabled{opacity:.3}
.mvp svg{width:20px;height:20px}
.th{position:relative}
.pgtb{margin-bottom:10px}
.tgrid:not(.selmode) .chk{display:none}
.tgrid.selmode .th.sel .thp{box-shadow:0 0 0 3px var(--warn),var(--shadow-s)}

var OCR={
  lib:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  worker:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  core:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
  data:function(l){return ['https://cdn.jsdelivr.net/npm/@tesseract.js-data/'+l+'/4.0.0_best_int','https://tessdata.projectnaptha.com/4.0.0'];}
};
function loadTess(){
  return new Promise(function(res,rej){
    if(window.Tesseract)return res();
    var sc=document.createElement('script');sc.src=OCR.lib;sc.onload=function(){res();};sc.onerror=function(){rej(new Error('lib'));};document.head.appendChild(sc);
  });
}
function prep(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var mx=1800,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,mx/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
      var x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
      var d=x.getImageData(0,0,c.width,c.height),a=d.data,hist=new Uint32Array(256),n=c.width*c.height,i,g;
      for(i=0;i<a.length;i+=4){g=(a[i]*0.299+a[i+1]*0.587+a[i+2]*0.114)|0;a[i]=g;hist[g]++;}
      var lo=0,hi=255,cum=0,q;
      for(q=0;q<256;q++){cum+=hist[q];if(cum>n*0.01){lo=q;break;}}
      cum=0;for(q=255;q>=0;q--){cum+=hist[q];if(cum>n*0.01){hi=q;break;}}
      var span=Math.max(1,hi-lo),v;
      for(i=0;i<a.length;i+=4){v=(a[i]-lo)*255/span;v=v<0?0:v>255?255:v;a[i]=a[i+1]=a[i+2]=v;}
      x.putImageData(d,0,0);URL.revokeObjectURL(url);res(c);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
async function ocrOne(cnv,lang,prog,off,span){
  var bases=OCR.data(lang),lastErr=null;
  for(var i=0;i<bases.length;i++){
    var w=null;
    try{
      w=await Tesseract.createWorker(lang,1,{workerPath:OCR.worker,corePath:OCR.core,langPath:bases[i],logger:function(m){prog(m.status||'',m.progress||0,off,span);}});
      var r=await w.recognize(cnv);
      await w.terminate();
      return {text:r.data.text,lines:r.data.lines||[]};
    }catch(e){lastErr=e;try{if(w)await w.terminate();}catch(x){}}
  }
  throw lastErr||new Error('ocr');
}
function mergeLines(A,B){
  var norm1=function(l){return {t:(l.text||'').trim(),c:l.confidence||0,y0:l.bbox.y0,y1:l.bbox.y1};};
  var out=A.map(norm1).filter(function(l){return l.t;});
  B.map(norm1).filter(function(l){return l.t;}).forEach(function(b){
    var hit=-1;
    for(var i=0;i<out.length;i++){
      var o=out[i],ov=Math.min(o.y1,b.y1)-Math.max(o.y0,b.y0);
      if(ov>0.5*Math.min(o.y1-o.y0,b.y1-b.y0)){hit=i;break;}
    }
    if(hit<0)out.push(b);else if(b.c>out[hit].c)out[hit]=b;
  });
  out.sort(function(x,y){return x.y0-y.y0;});
  var txt='';
  out.forEach(function(l,i){
    if(i){var p=out[i-1];txt+=(l.y0-p.y1>0.9*(p.y1-p.y0))?'\n\n':'\n';}
    txt+=l.t;
  });
  return txt;
}
async function runOcr(cnv,mode,prog){
  await loadTess();
  if(mode==='ara'||mode==='fra')return (await ocrOne(cnv,mode,prog,0,1)).text;
  var a=await ocrOne(cnv,'ara',prog,0,0.5);
  var f=await ocrOne(cnv,'fra',prog,0.5,0.5);
  return mergeLines(a.lines,f.lines);
}

/* find inside a notebook: every match on every page, highlighted until closed */
var FD={on:false,q:'',w:'',list:[],map:{},total:0,cur:0,t:0};
function fnorm(q){return norm(q).replace(/\s+/g,' ').trim();}
function rangesIn(root,w){
  var out=[],tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n;
  while((n=tw.nextNode())){
    var m=normMap(n.data),o=m.out.replace(/ /g,' '),i=0,j;
    while((j=o.indexOf(w,i))>=0){out.push([n,m.map[j],m.map[j+w.length-1]+1]);i=j+w.length;}
  }
  return out;
}
function findCompute(){
  var n=curNb();FD.list=[];FD.map={};FD.total=0;
  if(!FD.w||!n)return;
  n.pages.forEach(function(p){
    var t=document.createElement('div');t.innerHTML=String(p.html||'').replace(/<img[^>]*>/gi,'');
    var c=rangesIn(t,FD.w).length;
    if(c){FD.list.push({id:p.id,c:c,start:FD.total});FD.map[p.id]=1;FD.total+=c;}
  });
}
function findEntry(){for(var i=0;i<FD.list.length;i++)if(FD.cur>=FD.list[i].start&&FD.cur<FD.list[i].start+FD.list[i].c)return FD.list[i];return null;}
function findCount(){var el=$('fc');if(!el)return;el.textContent=FD.w?(FD.total?(FD.cur+1)+' / '+FD.total:'0'):'';}
function findApply(scroll){
  var hasAPI=window.CSS&&CSS.highlights&&typeof Highlight!=='undefined';
  if(hasAPI){CSS.highlights.delete('find');CSS.highlights.delete('findcur');}
  findCount();
  if(!FD.on||!FD.w)return;
  var rs=rangesIn(ed,FD.w).map(function(t){var r=document.createRange();r.setStart(t[0],t[1]);r.setEnd(t[0],t[2]);return r;});
  var en=null;for(var i=0;i<FD.list.length;i++)if(FD.list[i].id===pgId)en=FD.list[i];
  var ord=en?FD.cur-en.start:-1,cr=(ord>=0&&ord<rs.length)?rs[ord]:null;
  if(hasAPI){
    if(rs.length)CSS.highlights.set('find',new Highlight(...rs));
    if(cr)CSS.highlights.set('findcur',new Highlight(cr));
  }
  if(scroll&&cr){
    var rc=cr.getBoundingClientRect(),sr=scrollEl.getBoundingClientRect();
    scrollEl.scrollTop+=rc.top-(sr.top+Math.min(sr.height*0.35,200));
  }

}
function renderChipsHit(){
  var a=chips.querySelectorAll('[data-pg]');
  for(var i=0;i<a.length;i++)a[i].classList.toggle('fhit',!!(FD.on&&FD.map[a[i].dataset.pg]));
}
function findSoon(){clearTimeout(FD.t);FD.t=setTimeout(function(){if(!FD.on)return;findCompute();if(FD.cur>=FD.total)FD.cur=Math.max(0,FD.total-1);findApply(false);},350);}
function findShow(){
  var en=findEntry();if(!en){findApply(false);return;}
  if(en.id!==pgId){goPage(en.id);}
  findApply(true);
}
function findGo(d){

}
function findRun(){
  FD.q=$('fq').value;FD.w=fnorm(FD.q);findCompute();FD.cur=0;
  if(FD.total){
    var n=curNb(),ci=n.pages.indexOf(curPg());
    for(var i=0;i<FD.list.length;i++){if(n.pages.indexOf(findPageOf(FD.list[i].id))>=ci){FD.cur=FD.list[i].start;break;}}

function findPageOf(id){var n=curNb();for(var i=0;i<n.pages.length;i++)if(n.pages[i].id===id)return n.pages[i];return null;}
function openFind(){

      +'<div id="acMsg" class="acmsg">'+(msg||'')+'</div>'
      +'<button class="wide pri" data-ac="in" style="margin-top:12px">'+l.acIn+'</button>'
      +'<button class="wide" data-ac="up">'+l.acUp+'</button>'
      +'<button class="lnk" data-ac="reset">'+l.acForgot+'</button>';
  }
  return h+'</div>';
}
function accOpen(){return !sheet.hidden&&sheet.querySelector('#acBox');}
function accRender(){
  if(!accOpen())return;
  var em=$('acEm'),pw=$('acPw'),ev=em?em.value:'',pv=pw?pw.value:'',focus=document.activeElement&&document.activeElement.id;
  sheet.querySelector('.panel').innerHTML=accHTML().replace(/^<div class="ph">/,'<div class="ph">');
  if(ev&&$('acEm'))$('acEm').value=ev;if(pv&&$('acPw'))$('acPw').value=pv;
  if(focus&&$(focus))try{$(focus).focus();}catch(e){}
}
function openAccount(){openSheet(accHTML(),true);}
function accBusy(on){var a=sheet.querySelectorAll('[data-ac]');for(var i=0;i<a.length;i++)a[i].disabled=on;}
function accMsg(t,ok){var m=$('acMsg');if(m){m.textContent=t;m.className='acmsg'+(ok?' ok':'');}}
function accGo(kind){
  var em=($('acEm').value||'').trim(),pw=$('acPw').value||'',l=L();
  if(!em){accMsg(l.acMail);return;}
  if(kind==='reset'){
    accBusy(true);SY.R.reset(em).then(function(){accBusy(false);accMsg(l.acSent,true);},function(e){accBusy(false);accMsg(accErr(e));});return;
  }
  if(!pw){accMsg(l.acNoPw);return;}
  accBusy(true);accMsg('…',true);
  (kind==='up'?SY.R.signUp(em,pw):SY.R.signIn(em,pw)).then(function(){accBusy(false);closeSheet();toast(l.acWelcome);},function(e){accBusy(false);accMsg(accErr(e));});
}
sheet.addEventListener('click',function(e){
  var b=e.target.closest('[data-ac]');if(!b)return;
  var k=b.dataset.ac;
  if(k==='out'){SY.R.signOut().then(function(){closeSheet();toast(L().acBye);});return;}
  if(SY.R)accGo(k);
});
sheet.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='acPw'&&SY.R)accGo('in');});
$('accBtn').addEventListener('click',openAccount);
window.addEventListener('online',function(){accRender();clearTimeout(SY.diffT);SY.diffT=setTimeout(syncDiff,500);});
window.addEventListener('offline',accRender);
(function(){
  if(window.__REMOTE){SY.R=window.__REMOTE;}
  else if(!window.claude&&cfgOk(window.FIREBASE_CONFIG)){try{SY.R=fbRemote(window.FIREBASE_CONFIG);}catch(e){SY.R=null;}}
  if(SY.R)SY.R.onUser(onUser);
})();

/* ---------- phone viewport helpers ---------- */
function fitW(){
  var coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
  var a=Math.min(screen.width,screen.height),b=Math.max(screen.width,screen.height);
  if(coarse&&window.innerWidth>b+20){app.style.width=a+'px';}else{app.style.width='';}
}
function kb(){
  var v=window.visualViewport;if(!v)return;
  if(window.innerHeight-v.height>120){app.style.height=v.height+'px';app.style.transform='translateY('+v.offsetTop+'px)';}
  else{app.style.height='';app.style.transform='';}
}
if(window.visualViewport){visualViewport.addEventListener('resize',kb);visualViewport.addEventListener('scroll',kb);}

document.addEventListener('dragstart',function(e){e.preventDefault();});
document.addEventListener('selectstart',function(e){var t=e.target;t=t&&t.nodeType===3?t.parentNode:t;if(t&&t.closest&&t.closest('#ed,input,textarea'))return;e.preventDefault();});
document.addEventListener('contextmenu',function(e){var t=e.target;if(t&&t.closest&&t.closest('#ed,input,textarea'))return;e.preventDefault();});
['gesturestart','gesturechange'].forEach(function(g){document.addEventListener(g,function(e){e.preventDefault();});});
setLang();fitW();renderHome();renderNav();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.claude){navigator.serviceWorker.register('sw.js').catch(function(){});}}catch(e){}
})();
</script>
